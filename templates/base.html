<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}BusFlow{% endblock %}</title>
        <style>
            body { font-family: system-ui, sans-serif; margin: 0; }
            header { background: #1f2937; color: #fff; padding: 0.75rem 1rem; }
            nav { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
            nav a { color: #e5e7eb; text-decoration: none; padding: 0.4rem 0.7rem; border-radius: 0.4rem; }
            nav a:hover { background: #374151; color: #fff; }
            nav a.active { background: #2563eb; color: #fff; }
            nav a.admin-link { margin-left: auto; border: 1px solid #4b5563; }
            main { padding: 1rem; max-width: 900px; margin: 0 auto; }
            table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
            th, td { border: 1px solid #d1d5db; padding: 0.5rem 0.75rem; text-align: left; }
            th { background: #f3f4f6; }
            tbody tr:nth-child(even) { background: #f9fafb; }
            footer { color: #6b7280; text-align: center; padding: 1rem; }
        </style>
    </head>
    <body>
        <header>
            <nav>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Головна</a>
                <a href="{% url 'routes' %}" class="{% if request.resolver_match.url_name == 'routes' %}active{% endif %}">Маршрути</a>
                <a href="{% url 'trips' %}" class="{% if request.resolver_match.url_name == 'trips' %}active{% endif %}">Рейси</a>
                <a href="{% url 'vehicles' %}" class="{% if request.resolver_match.url_name == 'vehicles' %}active{% endif %}">Транспорт</a>
                <a href="{% url 'orders' %}" class="{% if request.resolver_match.url_name == 'orders' %}active{% endif %}">Замовлення клієнтів</a>
                <a href="{% url 'admin:index' %}" class="admin-link">Адмін-панель</a>
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>BusFlow &copy; 2026</footer>
    </body>
</html>
