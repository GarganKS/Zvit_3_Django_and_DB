{% extends 'base.html' %}
{% block title %}Вхід - BusFlow{% endblock %}
{% block content %}
<div class="form-narrow">
    <h2>Вхід</h2>
    {% if form.errors %}<p class="error-text">Невірний логін або пароль. Спробуйте ще раз.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">{{ form.as_div }}</div>
        <div class="form-actions">
            <button type="submit">Увійти</button>
        </div>
    </form>
    <p class="muted form-note">Немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
</div>
{% endblock %}
