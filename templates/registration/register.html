{% extends 'base.html' %}
{% block title %}Реєстрація - BusFlow{% endblock %}
{% block content %}
<h2>Реєстрація клієнта</h2>
<p>Створіть акаунт, щоб замовляти автобус для поїздок.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Зареєструватися</button>
</form>
<p>Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>
{% endblock %}
