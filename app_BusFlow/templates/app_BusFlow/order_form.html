{% extends 'base.html' %}
{% block title %}Замовити автобус - BusFlow{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <a href="{% url 'orders' %}" class="back"><i data-lucide="arrow-left"></i>Мої замовлення</a>
        <h1>Замовити автобус</h1>
        <p class="page-sub">Вкажіть напрямок, кількість пасажирів і час. Менеджер запропонує автобус та ціну.</p>
    </div>
</div>
<div class="panel form-panel">
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-grid">{{ form.as_div }}</div>
            <div class="form-actions">
                <button type="submit" class="btn"><i data-lucide="send"></i>Надіслати замовлення</button>
                <a href="{% url 'orders' %}" class="btn btn-ghost">Скасувати</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
