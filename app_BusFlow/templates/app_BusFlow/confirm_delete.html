{% extends 'base.html' %}
{% block title %}Видалення - BusFlow{% endblock %}
{% block content %}
<h2>{{ title|default:"Видалення" }}</h2>
<p>Впевнені, що хочете видалити «{{ object }}»? Цю дію не можна скасувати.</p>
<form method="post">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="btn-danger">Так, видалити</button>
        <a href="{{ request.META.HTTP_REFERER|default:'/' }}">Ні, повернутися</a>
    </div>
</form>
{% endblock %}
