{% extends 'base.html' %}
{% block title %}Видалення - BusFlow{% endblock %}
{% block content %}
<h2>{{ title|default:"Видалення" }}</h2>
<p>Впевнені, що хочете видалити «{{ object }}»? Цю дію не можна скасувати.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Так, видалити</button>
</form>
<p><a href="{{ request.META.HTTP_REFERER|default:'/' }}">Ні, повернутися</a></p>
{% endblock %}
