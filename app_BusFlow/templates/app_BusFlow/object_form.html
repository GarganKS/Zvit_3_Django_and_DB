{% extends 'base.html' %}
{% block title %}Редагування - BusFlow{% endblock %}
{% block content %}
<div class="form-narrow">
    <h2>{{ title|default:"Форма" }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">{{ form.as_div }}</div>
        <div class="form-actions">
            <button type="submit">Зберегти</button>
            <a href="{{ request.META.HTTP_REFERER|default:'/' }}">Назад</a>
        </div>
    </form>
    {% block form_extra %}{% endblock %}
</div>
{% endblock %}
