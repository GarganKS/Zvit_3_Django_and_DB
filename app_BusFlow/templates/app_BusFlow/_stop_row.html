{# Один рядок зупинки маршруту. Використовується і для наявних, і для нових (empty_form). #}
<li class="stop-row">
    <div class="stop-num-wrap">
        <span class="stop-num">1</span>
        <span class="stop-role"></span>
    </div>
    <div class="stop-fields">
        <div class="stop-field stop-field-main">
            <label for="{{ form.stop.id_for_label }}">{{ form.stop.label }}</label>
            {{ form.stop }}
            {{ form.stop.errors }}
        </div>
        {{ form.non_field_errors }}
    </div>
    <div class="stop-controls">
        <button type="button" class="icon-btn bordered" data-action="up" title="Підняти вище" aria-label="Підняти вище"><i data-lucide="arrow-up"></i></button>
        <button type="button" class="icon-btn bordered" data-action="down" title="Опустити нижче" aria-label="Опустити нижче"><i data-lucide="arrow-down"></i></button>
        <button type="button" class="icon-btn danger" data-action="delete" title="Видалити зупинку" aria-label="Видалити зупинку"><i data-lucide="trash-2"></i></button>
    </div>
    {% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
    <span hidden>{{ form.DELETE }}</span>
</li>
