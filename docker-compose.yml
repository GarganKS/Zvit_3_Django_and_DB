# MySQL 8 для BusFlow.
#
#   docker compose up -d          # підняти БД
#   docker compose down           # зупинити (дані лишаються у volume)
#   docker compose down -v        # зупинити разом з даними
#
# Паролі НЕ тримаємо тут - compose підставляє їх з .env
# (DB_PASSWORD, MYSQL_ROOT_PASSWORD). Якщо .env немає - compose зупиниться
# з помилкою, а не створить БД з порожнім паролем.
# Значення .env для compose читаються автоматично (файл лежить поруч).

services:
  mysql:
    image: mysql:8
    container_name: busflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-busflow}
      MYSQL_USER: ${DB_USER:-busflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - busflow_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  busflow_mysql_data:
